# Non-secret frontend settings. Mirrors frontend/.env.example.
#
# The frontend only ever talks to the llm-d router gateway -- there is no pool
# address here, and no knowledge of the handler. Changing this ConfigMap does
# NOT restart the Deployment; roll it yourself:
#   kubectl -n droidcam rollout restart deploy/droidcam-frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: droidcam-frontend-config
  labels:
    app.kubernetes.io/name: droidcam-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: droidcam-rtsp-ingestor
data:
  # --- llm-d router gateway ---
  # Point this at your gateway. In-cluster Service form shown; use the public
  # Envoy/gateway hostname instead if the router lives outside this cluster.
  GATEWAY_ENDPOINT: "http://llm-d-inference-gateway.llm-d-quickstart.svc.cluster.local:80"
  GATEWAY_CHAT_PATH: "/v1/chat/completions"
  MODEL: "Qwen/Qwen3-VL-2B-Instruct"

  # How long the token response to our POST may stay open. Keep this
  # comfortably above the handler's MAX_SESSION_SECONDS (default 300), or
  # tokens stop reaching the browser while the handler is still submitting
  # frames. See k8s/handler/configmap-defaults.yaml.
  RESPONSE_TIMEOUT: "600"

  # --- UI defaults (the browser can override both) ---
  PROMPT: "Describe what you see in this image."
  FRAME_INTERVAL: "2.0"

  # --- Web server ---
  HOST: "0.0.0.0"
  PORT: "8080"
