# ClusterIP only. External traffic arrives via the HTTPRoute in httproute.yaml.
apiVersion: v1
kind: Service
metadata:
  name: cellphone-camera-frontend
  labels:
    app.kubernetes.io/name: cellphone-camera-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cellphone-camera-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
