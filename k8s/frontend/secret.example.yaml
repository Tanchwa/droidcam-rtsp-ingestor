# Bearer token for the llm-d gateway, if it requires auth.
#
# This is an EXAMPLE. The Deployment references it with optional: true, so if
# your gateway needs no auth you can skip this file entirely and the pod still
# starts. To use it, copy and fill in:
#
#   cp k8s/frontend/secret.example.yaml /tmp/secret.yaml
#   # edit API_KEY, then:
#   kubectl apply -f /tmp/secret.yaml
#
# Or skip the file and create it imperatively (nothing lands in git):
#
#   kubectl -n droidcam create secret generic droidcam-frontend-secrets \
#     --from-literal=API_KEY='sk-...'
apiVersion: v1
kind: Secret
metadata:
  name: droidcam-frontend-secrets
  namespace: droidcam
  labels:
    app.kubernetes.io/name: droidcam-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: droidcam-rtsp-ingestor
type: Opaque
stringData:
  # Leave empty for a gateway with no auth.
  API_KEY: ""
