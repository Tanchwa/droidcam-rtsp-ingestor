# OPTIONAL. Only apply this if you do not already have a Gateway to attach to.
#
# Check first:
#   kubectl get gateways -A
#   kubectl get gatewayclass
#
# We use agentgateway (https://agentgateway.dev) as the data plane. Its control
# plane installs into `agentgateway-system` and registers a GatewayClass named
# `agentgateway`; creating a Gateway with that class makes the control plane
# provision the proxy Deployment + Service for it.
#
# If the agentgateway quickstart already left you a shared `agentgateway-proxy`
# Gateway in `agentgateway-system`, delete this file and point the HTTPRoute's
# parentRefs at that one instead (see the commented block in httproute.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cellphone-camera-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
spec:
  gatewayClassName: agentgateway
  # The AWS Load Balancer Controller defaults a provisioned Service to
  # `scheme: internal`, which gives you an NLB on private RFC1918 addresses --
  # unreachable from Cloudflare or anywhere else off-VPC. These annotations are
  # propagated by the agentgateway control plane onto the Service it creates for
  # this Gateway, and mirror what argocd-server already uses in this cluster.
  #
  # `subnets` is pinned explicitly because the VPC's public subnets are not
  # tagged for ELB auto-discovery (kubernetes.io/role/elb=1). Replace the IDs if
  # you move clusters, or add the tags and drop the annotation.
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "vlm-test.andrewsutliff.com"
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "vlm-test.andrewsutliff.com"
    tls:
      mode: Terminate
      certificateRefs:
      - name: vlm-test-andrewsutliff-com-tls
