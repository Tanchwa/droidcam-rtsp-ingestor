# Two unrelated identities live here. Do not conflate them:
#
#   cellphone-camera-handler            -- the handler pods themselves. Deliberately
#                                  has NO permissions; the pod spec also sets
#                                  automountServiceAccountToken: false. The
#                                  handler never touches the Kubernetes API.
#
#   cellphone-camera-handler-provisioner -- the permission set the llm-d gateway hook
#                                  needs in THIS namespace to read the job
#                                  template and create/reap handler Jobs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellphone-camera-handler
  labels:
    app.kubernetes.io/name: cellphone-camera-handler
    app.kubernetes.io/component: handler
    app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellphone-camera-handler-provisioner
  labels:
    app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
rules:
  # Read the Job template and the shared defaults.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Stamp out one Job per session, and reap it when the session ends.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Observe handler pods and pull their logs for debugging a session.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Let the hook run handler Jobs as the (unprivileged) handler SA.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
# Grants the EPP those rights in this namespace only.
#
# EDIT THE SUBJECT BELOW. It must name the ServiceAccount the llm-d Endpoint
# Picker actually runs as -- BOTH the name and its namespace. The EPP generally
# runs in a different namespace from this binding, and getting either field
# wrong fails silently: Kubernetes matches subjects by name string, so a binding
# naming a ServiceAccount that does not exist is stored without complaint and
# grants nothing. No error, no event.
#
# Find the real values (search all namespaces -- the EPP's namespace varies by
# install, e.g. llm-d-quickstart for the quickstart guide):
#   kubectl get deploy -A -l llm-d.ai/igw-mode \
#     -o custom-columns='NS:.metadata.namespace,DEPLOY:.metadata.name,SA:.spec.template.spec.serviceAccountName'
#
# Then VERIFY -- the binding existing proves nothing:
#   SA=system:serviceaccount:<epp-ns>:<epp-sa>
#   kubectl auth can-i create jobs --as=$SA -n cellphone-cam   # must be yes
#   kubectl auth can-i create jobs --as=$SA -n default         # must be no
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellphone-camera-handler-provisioner
  # No explicit namespace: ArgoCD applies this into its destination namespace
  # (cellphone-cam). That namespace is what decides WHERE these permissions
  # apply -- not the namespace the EPP runs in.
  labels:
    app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellphone-camera-handler-provisioner
subjects:
  - kind: ServiceAccount
    # Must match the EPP Deployment's serviceAccountName...
    name: llm-d-quickstart-epp
    # ...and the namespace that Deployment runs in.
    namespace: llm-d-quickstart
