# A handler Job with literal values, for testing the image by hand without a
# gateway hook in the loop. This is the k8s equivalent of the `uv run
# droidcam-handler` snippet in the README.
#
# It is the job template with the placeholders filled in and MAX_FRAMES=3, so
# it submits three frames and exits instead of running for five minutes.
#
#   # edit STREAM_URL and POOL_ENDPOINT below, then:
#   kubectl apply -f k8s/handler/example-job.yaml
#   kubectl -n droidcam logs -f job/droidcam-handler-manual
#   kubectl -n droidcam delete job droidcam-handler-manual
#
# Exit codes: 0 completed, 1 the stream never produced frames, 2 misconfigured.
#
# Heads up: STREAM_URL usually points at a phone on your LAN. A pod cannot
# reach that unless the cluster has a route to it -- on a remote cluster this
# will fail with exit 1 no matter how correct the manifest is.
