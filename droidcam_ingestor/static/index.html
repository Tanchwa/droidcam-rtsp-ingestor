<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DroidCam → VLM Inference</title>
  <style>
    :root { --bg:#0f1117; --panel:#1a1d27; --border:#2a2e3b; --text:#e6e8ee; --muted:#8b90a0; --accent:#4f8cff; --accent-stop:#ff5c5c; --ok:#3ddc84; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:820px; margin:0 auto; padding:28px 20px 60px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; }
    label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
    input, textarea { width:100%; background:#0f1117; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--accent); }
    textarea { resize:vertical; min-height:60px; }
    .row { display:flex; gap:14px; margin-top:14px; }
    .row > div { flex:1; }
    .field { margin-top:14px; }
    .controls { display:flex; gap:12px; align-items:center; margin-top:20px; }
    button { border:none; border-radius:8px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; }
    #start { background:var(--accent); color:#fff; }
    #stop { background:transparent; color:var(--accent-stop); border:1px solid var(--accent-stop); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .status { margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:7px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
    .dot.live { background:var(--ok); box-shadow:0 0 0 3px rgba(61,220,132,.2); }
    .dot.err { background:var(--accent-stop); }
    #output { margin-top:22px; background:#0b0d13; border:1px solid var(--border); border-radius:10px; padding:16px; min-height:220px; max-height:460px; overflow-y:auto; }
    .resp { padding:10px 0; border-bottom:1px solid var(--border); }
    .resp:last-child { border-bottom:none; }
    .resp .meta { font-size:11px; color:var(--muted); margin-bottom:4px; }
    .resp .body { white-space:pre-wrap; }
    .resp.cur .body::after { content:"▋"; color:var(--accent); animation:blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .log-err { color:var(--accent-stop); }
    .empty { color:var(--muted); font-style:italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DroidCam → VLM Inference</h1>
    <p class="sub">Point at a DroidCam RTSP/MJPEG stream; each sampled frame is sent to the VLM inference server and its response streams back live.</p>

    <div class="panel">
      <div class="field">
        <label for="url">DroidCam stream URL</label>
        <input id="url" type="text" placeholder="rtsp://192.168.1.42:4747/  or  http://192.168.1.42:4747/video" />
      </div>

      <div class="field">
        <label for="prompt">Prompt sent with each frame</label>
        <textarea id="prompt">Describe what you see in this image. Note any people, objects, and activity.</textarea>
      </div>

      <div class="row">
        <div>
          <label for="interval">Seconds between frames</label>
          <input id="interval" type="number" min="0.2" step="0.2" value="2" />
        </div>
      </div>

      <div class="controls">
        <button id="start">Start inference</button>
        <button id="stop" disabled>Stop</button>
        <span class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></span>
      </div>
    </div>

    <div id="output"><span class="empty">Responses will appear here…</span></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const startBtn = $("start"), stopBtn = $("stop");
    const dot = $("dot"), statusText = $("statusText"), output = $("output");
    let ws = null, current = null, emptied = false;

    function setStatus(text, kind) {
      statusText.textContent = text;
      dot.className = "dot" + (kind ? " " + kind : "");
    }

    function clearEmpty() {
      if (!emptied) { output.innerHTML = ""; emptied = true; }
    }

    function newResponse(index) {
      clearEmpty();
      if (current) current.el.classList.remove("cur");
      const el = document.createElement("div");
      el.className = "resp cur";
      el.innerHTML = `<div class="meta">frame #${index} · ${new Date().toLocaleTimeString()}</div><div class="body"></div>`;
      output.appendChild(el);
      current = { el, body: el.querySelector(".body"), text: "" };
      output.scrollTop = output.scrollHeight;
    }

    function appendToken(text) {
      if (!current) return;
      current.text += text;
      current.body.textContent = current.text;
      output.scrollTop = output.scrollHeight;
    }

    function logError(message) {
      clearEmpty();
      const el = document.createElement("div");
      el.className = "resp log-err";
      el.innerHTML = `<div class="meta">error · ${new Date().toLocaleTimeString()}</div><div class="body"></div>`;
      el.querySelector(".body").textContent = message;
      output.appendChild(el);
      output.scrollTop = output.scrollHeight;
    }

    function start() {
      const stream_url = $("url").value.trim();
      if (!stream_url) { setStatus("enter a stream URL", "err"); return; }
      const prompt = $("prompt").value;
      const interval = parseFloat($("interval").value) || 2;

      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws/inference`);
      setStatus("connecting…");
      startBtn.disabled = true;

      ws.onopen = () => {
        ws.send(JSON.stringify({ action: "start", stream_url, prompt, interval }));
        stopBtn.disabled = false;
      };
      ws.onmessage = (ev) => {
        const m = JSON.parse(ev.data);
        if (m.type === "status") setStatus(m.message, "live");
        else if (m.type === "frame_start") newResponse(m.index);
        else if (m.type === "token") appendToken(m.text);
        else if (m.type === "frame_end") { if (current) current.el.classList.remove("cur"); }
        else if (m.type === "error") { logError(m.message); setStatus("error (see output)", "err"); }
      };
      ws.onclose = () => { setStatus("disconnected"); resetButtons(); };
      ws.onerror = () => { setStatus("connection error", "err"); };
    }

    function stop() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: "stop" }));
      setStatus("stopping…");
      stopBtn.disabled = true;
      setTimeout(() => { if (ws) ws.close(); }, 300);
    }

    function resetButtons() { startBtn.disabled = false; stopBtn.disabled = true; if (current) current.el.classList.remove("cur"); }

    startBtn.onclick = start;
    stopBtn.onclick = stop;
  </script>
</body>
</html>
