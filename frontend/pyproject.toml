[project]
name = "cellphone-camera-frontend"
version = "0.1.0"
description = "Web UI that opens a cellphone camera VLM inference session against the llm-d router gateway."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.scripts]
cellphone-camera-frontend = "cellphone_camera_frontend.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cellphone_camera_frontend"]
